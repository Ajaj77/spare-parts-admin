// ===== STATE =====
let products = [];
let currentBrand = 'الكل';
let searchQuery = '';
let uploadedFiles = [];

// ===== INIT =====
function init() {
  const saved = localStorage.getItem('sparePartsData');
  if (saved) {
    try {
      products = JSON.parse(saved);
      showToast('✅ تم تحميل البيانات المحفوظة');
    } catch(e) {
      products = [...DEFAULT_DATA];
    }
  } else {
    products = [...DEFAULT_DATA];
  }
  renderBrands();
  renderProducts();
  updateStats();
}

// ===== RENDER BRANDS =====
function renderBrands() {
  const brands = ['الكل', ...new Set(products.map(p => p.brand))];
  const container = document.getElementById('brandFilters');
  container.innerHTML = brands.map(b => `
    <div class="brand-chip ${b === currentBrand ? 'active' : ''}" onclick="filterBrand('${b}')">${b}</div>
  `).join('');
}

// ===== FILTER =====
function filterBrand(brand) {
  currentBrand = brand;
  renderBrands();
  renderProducts();
}

// ===== SEARCH =====
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.toLowerCase().trim();
  renderProducts();
});

// ===== RENDER PRODUCTS =====
function renderProducts() {
  const list = document.getElementById('productList');
  let filtered = products;

  if (currentBrand !== 'الكل') {
    filtered = filtered.filter(p => p.brand === currentBrand);
  }

  if (searchQuery) {
    filtered = filtered.filter(p => {
      const text = (p.model + ' ' + p.brand + ' ' + p.type).toLowerCase();
      return text.includes(searchQuery);
    });
  }

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="no-results">
        <div class="no-results-icon">🔍</div>
        <div>لا توجد نتائج</div>
        <div style="font-size:12px; margin-top:8px;">جرب بحثًا مختلفًا</div>
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map((p, idx) => {
    const prices = p.prices || {};
    const priceKeys = Object.keys(prices);
    const firstPrice = priceKeys.length > 0 ? prices[priceKeys[0]] : '';
    const modelHtml = highlightText(p.model, searchQuery);

    let priceRows = '';
    for (const [k, v] of Object.entries(prices)) {
      priceRows += `
        <div class="price-row">
          <span class="price-label">${k}</span>
          <span style="display:flex; align-items:center;">
            <button class="edit-price-btn" onclick="event.stopPropagation(); editPrice(${p.id}, '${k}')">✏️</button>
            <span class="price-value">${v}</span>
          </span>
        </div>
      `;
    }

    return `
      <div class="product-card" id="card-${p.id}" onclick="toggleCard(${p.id})">
        <div class="product-header">
          <div>
            <div class="product-model">${modelHtml}</div>
            <span class="product-brand">${p.brand}</span>
            <div class="product-type">${p.type} ${p.colors ? '• ' + p.colors.join(', ') : ''}</div>
          </div>
          <div class="product-prices-preview">
            ${firstPrice ? `<span class="price-tag">${firstPrice}</span>` : ''}
          </div>
        </div>
        <div class="price-details" id="details-${p.id}">
          ${priceRows}
        </div>
      </div>
    `;
  }).join('');
}

function highlightText(text, query) {
  if (!query) return text;
  const regex = new RegExp(`(${query})`, 'gi');
  return text.replace(regex, '<span class="highlight">$1</span>');
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  card.classList.toggle('expanded');
}

// ===== EDIT PRICE =====
function editPrice(id, priceKey) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  const current = p.prices[priceKey];
  const newVal = prompt(`تعديل سعر "${p.model}" - ${priceKey}:
السعر الحالي: ${current}`, current);
  if (newVal !== null && newVal.trim() !== '') {
    p.prices[priceKey] = newVal.trim();
    saveData();
    renderProducts();
    showToast('✅ تم تحديث السعر');
  }
}

// ===== SAVE =====
function saveData() {
  localStorage.setItem('sparePartsData', JSON.stringify(products));
  updateStats();
}

function updateStats() {
  document.getElementById('totalCount').textContent = `📦 ${products.length} منتج`;
}

// ===== RESET =====
function resetData() {
  if (confirm('هل تريد استعادة الأسعار الأصلية؟ سيتم حذف جميع التعديلات!')) {
    products = [...DEFAULT_DATA];
    localStorage.removeItem('sparePartsData');
    currentBrand = 'الكل';
    searchQuery = '';
    document.getElementById('searchInput').value = '';
    renderBrands();
    renderProducts();
    updateStats();
    showToast('🔄 تم استعادة البيانات الأصلية');
  }
}

// ===== UPLOAD MODAL =====
function openUploadModal() {
  document.getElementById('uploadModal').classList.add('show');
  uploadedFiles = [];
  renderFileList();
}
function closeUploadModal() {
  document.getElementById('uploadModal').classList.remove('show');
}

// ===== DRAG & DROP =====
const uploadArea = document.getElementById('uploadArea');
uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

function handleFiles(files) {
  for (const file of files) {
    if (file.name.endsWith('.xlsx')) {
      uploadedFiles.push({ file, status: 'pending', data: null });
    }
  }
  renderFileList();
}

function renderFileList() {
  const list = document.getElementById('fileList');
  if (uploadedFiles.length === 0) {
    list.innerHTML = '';
    return;
  }
  list.innerHTML = uploadedFiles.map((f, i) => `
    <div class="file-item">
      <span class="file-name">📄 ${f.file.name}</span>
      <span class="file-status ${f.status}">${f.status === 'pending' ? '⏳ جاري' : f.status === 'done' ? '✅ تم' : '❌ خطأ'}</span>
    </div>
  `).join('');
}

// ===== PROCESS FILES =====
async function processFiles() {
  if (uploadedFiles.length === 0) {
    showToast('⚠️ الرجاء اختيار ملف أولاً');
    return;
  }

  const progress = document.getElementById('progressFill');
  let updated = 0;

  for (let i = 0; i < uploadedFiles.length; i++) {
    const uf = uploadedFiles[i];
    progress.style.width = `${((i) / uploadedFiles.length) * 100}%`;

    try {
      const data = await readExcel(uf.file);
      const parsed = parseExcelData(data, uf.file.name);

      // Merge: update existing or add new
      for (const newItem of parsed) {
        const existing = products.find(p => 
          p.brand === newItem.brand && 
          p.model.toLowerCase() === newItem.model.toLowerCase() &&
          p.type === newItem.type
        );
        if (existing) {
          existing.prices = { ...existing.prices, ...newItem.prices };
          if (newItem.colors) existing.colors = newItem.colors;
          updated++;
        } else {
          newItem.id = Math.max(...products.map(p => p.id), 0) + 1;
          products.push(newItem);
          updated++;
        }
      }

      uf.status = 'done';
    } catch(e) {
      console.error(e);
      uf.status = 'error';
    }
    renderFileList();
  }

  progress.style.width = '100%';
  saveData();
  renderBrands();
  renderProducts();

  setTimeout(() => {
    closeUploadModal();
    showToast(`✅ تم تحديث ${updated} منتج بنجاح!`);
    progress.style.width = '0%';
  }, 800);
}

// ===== READ EXCEL =====
function readExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const result = {};
        workbook.SheetNames.forEach(name => {
          result[name] = XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1 });
        });
        resolve(result);
      } catch(err) {
        reject(err);
      }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

// ===== PARSE EXCEL DATA =====
function parseExcelData(data, filename) {
  const lower = filename.toLowerCase();
  const sheets = Object.values(data);
  if (sheets.length === 0) return [];

  const rows = sheets[0];
  const result = [];

  // Samsung LCD
  if (lower.includes('samsung') && !lower.includes('svc')) {
    for (let i = 2; i < rows.length; i++) {
      const r = rows[i];
      if (!r || !r[2]) continue;
      const model = String(r[2]).trim();
      if (!model || model === 'nan') continue;
      const prices = {};
      if (r[3] && String(r[3]).trim()) prices['Original'] = String(r[3]).trim();
      if (r[4] && String(r[4]).trim()) prices['OLED'] = String(r[4]).trim();
      if (r[5] && String(r[5]).trim()) prices['OLED2'] = String(r[5]).trim();
      if (r[6] && String(r[6]).trim()) prices['INCELL'] = String(r[6]).trim();
      if (Object.keys(prices).length > 0) {
        result.push({ brand: 'Samsung', model, type: 'LCD', prices });
      }
    }
  }
  // iPhone LCD
  else if (lower.includes('iphone') || lower.includes('ipone')) {
    for (let i = 2; i < rows.length; i++) {
      const r = rows[i];
      if (!r || !r[1]) continue;
      const model = String(r[1]).trim();
      if (!model || model === 'nan') continue;
      const prices = {};
      const pmap = {'Copy':2,'Second Hand':3,'Change Glass':4,'FOG':5,'Original GX':6,'Copy GX':7,'WD INCELL':8,'HD UTC TFT':9};
      for (const [k, idx] of Object.entries(pmap)) {
        if (r[idx] && String(r[idx]).trim()) prices[k] = String(r[idx]).trim();
      }
      if (Object.keys(prices).length > 0) {
        result.push({ brand: 'iPhone', model, type: 'LCD', prices });
      }
    }
  }
  // SVC Service Pack
  else if (lower.includes('svc')) {
    let current = null;
    for (let i = 2; i < rows.length; i++) {
      const r = rows[i];
      if (!r) continue;
      const item = r[1] ? String(r[1]).trim() : '';
      const color = r[2] ? String(r[2]).trim() : '';
      const price = r[3];

      if (item && item !== 'nan') {
        if (current) result.push(current);
        const p = {};
        if (price !== undefined && price !== null && String(price).trim()) {
          try { p['Price'] = String(parseInt(price)); } catch(e) { p['Price'] = String(price).trim(); }
        }
        current = {
          brand: 'Samsung', model: item, type: 'Service Pack',
          prices: p, colors: (color && color !== 'nan') ? [color] : []
        };
      } else if (current && color && color !== 'nan') {
        if (price !== undefined && price !== null && String(price).trim()) {
          try { current.prices[color] = String(parseInt(price)); } catch(e) { current.prices[color] = String(price).trim(); }
        }
        current.colors.push(color);
      }
    }
    if (current) result.push(current);
  }
  // Multi-brand (INF HW XI ITEL)
  else {
    let currentBrand = null;
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      if (!r) continue;
      const first = String(r[0] || '').trim().toUpperCase();
      if (['HUAWEI','INFINX','TECNO','ITEL','REDMI','POCO','XIAOMI','BACK SHRAK','OPPO','REALME','RENO','VIVO'].includes(first)) {
        currentBrand = first;
        continue;
      }
      if (!currentBrand) continue;
      const model = r[1] ? String(r[1]).trim() : '';
      if (!model || model.toLowerCase() === 'nan' || model.toLowerCase() === 'model') continue;

      const prices = {};
      let pmap = {};
      if (currentBrand === 'HUAWEI') pmap = {'AAA':2,'ORI':4,'ORG':5,'ORG WF':6,'OLED':7};
      else if (['INFINX','TECNO'].includes(currentBrand)) pmap = {'TFT':2,'ORI':3,'ORG':4,'OLED':5};
      else if (currentBrand === 'ITEL') pmap = {'TFT/AAA':2,'ORI':3,'ORG':4,'OLED':5};
      else if (['REDMI','POCO'].includes(currentBrand)) pmap = {'TFT/AAA':2,'ORI':3,'ORG':4,'OLED':5};
      else if (currentBrand === 'XIAOMI') pmap = {'INCELL':2,'ORI':3,'ORG':4,'OLED':5};
      else if (currentBrand === 'BACK SHRAK') pmap = {'INCELL':2,'ORG':3};
      else if (currentBrand === 'OPPO') pmap = {'INCELL':2,'ORI':3,'ORG':4,'OLED':5};
      else if (currentBrand === 'REALME') pmap = {'TFT':2,'ORI':3,'ORG':4,'OLED':5};
      else if (currentBrand === 'RENO') pmap = {'INCELL':2,'ORG':3,'OLED':4};
      else if (currentBrand === 'VIVO') pmap = {'ORI':2,'ORG':3,'INCELL':4,'OLED':5};

      for (const [k, idx] of Object.entries(pmap)) {
        if (r[idx] && String(r[idx]).trim() && String(r[idx]).trim().toLowerCase() !== 'nan') {
          prices[k] = String(r[idx]).trim();
        }
      }
      if (Object.keys(prices).length > 0) {
        result.push({ brand: currentBrand.charAt(0) + currentBrand.slice(1).toLowerCase(), model, type: 'LCD', prices });
      }
    }
  }

  return result;
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== START =====
init();
</script>
