<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل أسعار الشاشات قطع الغيار</title>
    <!-- مكتبة SheetJS لقراءة ملفات الإكسل -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            padding: 10px;
            font-size: 14px;
            direction: rtl;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* TOP CONTROL PANEL */
        .top-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .search-box-wrap {
            position: relative;
            width: 100%;
        }

        .search-box-wrap input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--primary);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            font-weight: 700;
            background: #fff;
        }

        .search-box-wrap input:focus {
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }

        .action-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 80px;
            padding: 9px 10px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-upload { background: var(--primary); color: white; }
        .btn-clear { background: #fee2e2; color: #991b1b; }
        .btn-toggle { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stats-bar strong {
            color: var(--primary-dark);
            font-size: 0.95rem;
        }

        .save-indicator {
            color: var(--success);
            font-size: 0.78rem;
            font-weight: 800;
        }

        /* BRAND TABS */
        .brand-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .brand-tab {
            background: #e2e8f0;
            border: none;
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            color: #475569;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .brand-tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.3);
        }

        /* VIEW MODE 1: CARDS VIEW (أفضل وأوضح طريقة للعرض للموبايل) */
        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .model-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #0f172a;
        }

        .updated-tag {
            background: #fef3c7;
            color: #b45309;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .qualities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
        }

        .quality-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
        }

        .quality-name {
            font-size: 0.78rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
        }

        .price-tag {
            font-size: 1rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 6px;
            width: 100%;
        }

        /* ألوان الجودات المتميزة */
        .bg-original { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .bg-oled { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .bg-incell { background-color: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        .bg-other { background-color: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }

        .group-banner {
            background: #0284c7;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.95rem;
            text-align: center;
            margin-top: 6px;
        }

        /* VIEW MODE 2: TABLE VIEW */
        .table-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }

        .table-wrapper {
            max-height: 70vh;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        thead {
            position: sticky;
            top: 0;
            background: #0f172a;
            color: #ffffff;
            z-index: 20;
        }

        th {
            padding: 10px 6px;
            font-weight: 700;
            font-size: 0.82rem;
            border-bottom: 2px solid var(--border);
        }

        th:first-child, td:first-child {
            text-align: right;
            padding-right: 12px;
            font-weight: 800;
        }

        td {
            padding: 10px 6px;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
        }

        tbody tr:nth-child(even) { background-color: #f8fafc; }

        .empty-box {
            padding: 50px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        @media print {
            .top-panel { position: static; box-shadow: none; }
            .action-btns, input[type="file"] { display: none; }
            body { padding: 0; background: white; }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- SHIRIT CONTROL & SEARCH -->
    <div class="top-panel">
        <div class="search-box-wrap">
            <input type="text" id="searchInput" placeholder="🔍 ابحث بالموديل أو نوع الشاشة (مثال: Note9, OLED, INCELL)..." onkeyup="applyFilter()">
        </div>

        <div class="action-btns">
            <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">📥 رفع إكسل</button>
            <button class="btn btn-toggle" id="viewToggleBtn" onclick="toggleViewMode()">📱 عرض الكروت</button>
            <button class="btn btn-clear" onclick="clearAllData()">🗑️ مسح البيانات</button>
            <input type="file" id="fileInput" multiple accept=".xlsx, .xls" style="display: none;" onchange="handleFiles(this.files)">
        </div>

        <div class="stats-bar">
            <span>النتائج المطابقة: <strong id="statFilteredRows">0</strong> / <strong id="statTotalRows">0</strong></span>
            <span class="save-indicator" id="saveStatus">💾 محفوظ تلقائياً</span>
        </div>

        <div class="brand-tabs" id="brandTabs"></div>
    </div>

    <!-- MAIN DISPLAY AREA -->
    <div id="displayArea">
        <div class="empty-box">
            لا توجد بيانات محفوظة حالياً.<br>اضغط على <strong>"📥 رفع إكسل"</strong> لإضافة الملفات.
        </div>
    </div>

</div>

<script>
    const STORAGE_KEY = 'PHONE_PARTS_STORE_V3';
    let masterStore = {};
    let activeBrand = '';
    let currentViewMode = 'cards'; // 'cards' or 'table'

    function cleanStr(val) {
        if (val === null || val === undefined) return '';
        return String(val).replace(/\r?\n|\r/g, ' ').trim();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadFromStorage();
    });

    function saveToStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(masterStore));
            document.getElementById('saveStatus').innerText = '💾 تم الحفظ تلقائياً';
        } catch (e) {
            console.error('Storage limit reached', e);
        }
    }

    function loadFromStorage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                masterStore = JSON.parse(saved);
                const keys = Object.keys(masterStore);
                if (keys.length > 0) {
                    activeBrand = keys[0];
                    renderBrandTabs();
                    renderDisplay();
                }
            } catch (e) {
                console.error(e);
            }
        }
    }

    function clearAllData() {
        if (confirm('هل أنت متأكد من مسح جميع البيانات والملفات المحفوظة؟')) {
            localStorage.removeItem(STORAGE_KEY);
            masterStore = {};
            activeBrand = '';
            document.getElementById('brandTabs').innerHTML = '';
            document.getElementById('displayArea').innerHTML = '<div class="empty-box">تم مسح البيانات بنجاح.<br>قم برفع ملفات جديدة.</div>';
            document.getElementById('statFilteredRows').innerText = '0';
            document.getElementById('statTotalRows').innerText = '0';
            document.getElementById('fileInput').value = '';
        }
    }

    function toggleViewMode() {
        currentViewMode = currentViewMode === 'cards' ? 'table' : 'cards';
        document.getElementById('viewToggleBtn').innerText = currentViewMode === 'cards' ? '📱 عرض الكروت' : '📊 عرض الجدول';
        renderDisplay();
    }

    function handleFiles(files) {
        if (!files.length) return;

        let promises = Array.from(files).map(file => {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    let brandKey = detectBrandKey(file.name);
                    let sheetName = workbook.SheetNames[0];
                    const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: '' });

                    if (rawRows.length > 0) {
                        processSmartData(brandKey, rawRows);
                    }
                    resolve();
                };
                reader.readAsArrayBuffer(file);
            });
        });

        Promise.all(promises).then(() => {
            saveToStorage();
            if (!activeBrand || !masterStore[activeBrand]) {
                activeBrand = Object.keys(masterStore)[0] || '';
            }
            renderBrandTabs();
            renderDisplay();
        });
    }

    function detectBrandKey(filename) {
        const fn = filename.toLowerCase();
        if (fn.includes('samsung') || fn.includes('سامسونج')) return 'Samsung';
        if (fn.includes('ipone') || fn.includes('iphone') || fn.includes('آيفون')) return 'iPhone';
        if (fn.includes('svc') || fn.includes('service')) return 'SVC (قطع صيانة)';
        if (fn.includes('inf') || fn.includes('huawei') || fn.includes('xiaomi') || fn.includes('redmi')) return 'Infinix & Xiaomi';
        return filename.replace(/\.[^/.]+$/, "");
    }

    // خوارزمية ذكية لاكتشاف أسماء الجودات والأنواع (Original, OLED, INCELL) من ملف الإكسل
    function processSmartData(brandKey, rawRows) {
        let maxCols = 0;
        for (let r = 0; r < Math.min(15, rawRows.length); r++) {
            if (rawRows[r] && rawRows[r].length > maxCols) maxCols = rawRows[r].length;
        }

        const keywords = ['original', 'oled', 'incell', 'incel', 'copy', 'fog', 'gx', 'aaa', 'ori', 'org', 'service', 'pack', 'glass', 'change', 'tft', 'lcd', 'نوع', 'درجة', 'جودة', 'شاشة', 'سعر', 'موديل'];

        // البحث عن أفضل سطر يحتوي على الجودات والأنواع
        let detectedHeaders = new Array(maxCols).fill('');
        
        for (let c = 0; c < maxCols; c++) {
            for (let r = 0; r < Math.min(10, rawRows.length); r++) {
                let cellVal = cleanStr(rawRows[r][c]);
                // تجاهل التواريخ الأرقام الشائعة
                if (cellVal && isNaN(cellVal) && !cellVal.match(/^\d{1,2}[\/\.-]\d{1,2}[\/\.-]\d{2,4}$/)) {
                    if (keywords.some(kw => cellVal.toLowerCase().includes(kw)) || cellVal.length > 2) {
                        detectedHeaders[c] = cellVal;
                        break;
                    }
                }
            }
        }

        // إعطاء أسماء افتراضية ذكية للخلية التي لم يُكتشف اسمها
        for (let c = 0; c < maxCols; c++) {
            if (!detectedHeaders[c] || detectedHeaders[c] === '-') {
                detectedHeaders[c] = (c === 0) ? 'الموديل/الصنف' : ('جودة ' + c);
            }
        }

        if (!masterStore[brandKey]) {
            masterStore[brandKey] = {
                headers: detectedHeaders,
                itemsMap: {},
                itemsList: []
            };
        }

        const store = masterStore[brandKey];
        store.headers = detectedHeaders;

        for (let r = 0; r < rawRows.length; r++) {
            const row = rawRows[r];
            if (!row || row.every(c => cleanStr(c) === '')) continue;

            const nonNull = row.filter(c => cleanStr(c) !== '');
            const isGroup = nonNull.length === 1 && typeof nonNull[0] === 'string' && isNaN(nonNull[0]) && !nonNull[0].match(/^\d{1,2}[\/\.-]/);

            if (isGroup) {
                const groupName = cleanStr(nonNull[0]);
                if (!store.itemsMap['GRP_' + groupName]) {
                    const gObj = { isGroup: true, name: groupName };
                    store.itemsMap['GRP_' + groupName] = gObj;
                    store.itemsList.push(gObj);
                }
                continue;
            }

            let modelName = cleanStr(row[0]) || cleanStr(row[1]);
            // التأكد أن الصنف ليس هيدر
            if (!modelName || modelName.toLowerCase().includes('model') || keywords.some(k => modelName.toLowerCase() === k)) continue;

            const key = modelName.toLowerCase();
            const existing = store.itemsMap[key];

            const vals = [];
            for (let c = 0; c < detectedHeaders.length; c++) {
                vals.push(cleanStr(row[c]));
            }

            if (existing) {
                for (let c = 0; c < vals.length; c++) {
                    if (vals[c] !== '') existing.values[c] = vals[c];
                }
                existing.updated = true;
            } else {
                const itemObj = {
                    isGroup: false,
                    key: key,
                    values: vals,
                    updated: false
                };
                store.itemsMap[key] = itemObj;
                store.itemsList.push(itemObj);
            }
        }
    }

    function renderBrandTabs() {
        const container = document.getElementById('brandTabs');
        container.innerHTML = '';

        Object.keys(masterStore).forEach(b => {
            const btn = document.createElement('button');
            btn.className = `brand-tab ${b === activeBrand ? 'active' : ''}`;
            btn.innerText = b;
            btn.onclick = () => {
                activeBrand = b;
                renderBrandTabs();
                renderDisplay();
            };
            container.appendChild(btn);
        });
    }

    function getQualityBadgeClass(qName) {
        const q = qName.toLowerCase();
        if (q.includes('orig') || q.includes('service') || q.includes('org') || q.includes('اصلي') || q.includes('أصلي')) return 'bg-original';
        if (q.includes('oled') || q.includes('gx')) return 'bg-oled';
        if (q.includes('incell') || q.includes('incel') || q.includes('copy') || q.includes('tft') || q.includes('تجاري')) return 'bg-incell';
        return 'bg-other';
    }

    function renderDisplay() {
        const container = document.getElementById('displayArea');
        if (!activeBrand || !masterStore[activeBrand]) {
            container.innerHTML = '<div class="empty-box">لا توجد بيانات متاحة</div>';
            return;
        }

        const data = masterStore[activeBrand];
        const headers = data.headers;
        const items = data.itemsList;

        let totalCount = 0;

        if (currentViewMode === 'cards') {
            // عرض الكروت الذكي
            let html = '<div class="cards-grid">';
            items.forEach(item => {
                if (item.isGroup) {
                    html += `<div class="group-banner" data-group="true">${item.name.toUpperCase()}</div>`;
                } else {
                    totalCount++;
                    const modelName = item.values[0] || item.values[1] || 'غير معنون';
                    html += `
                    <div class="item-card" data-item="true">
                        <div class="card-header">
                            <span class="model-title">${modelName}</span>
                            ${item.updated ? '<span class="updated-tag">تم التحديث</span>' : ''}
                        </div>
                        <div class="qualities-grid">`;

                    for (let c = 1; c < headers.length; c++) {
                        const val = item.values[c];
                        const qTitle = headers[c] || ('نوع ' + c);
                        if (val && val !== '-' && !isNaN(val) && Number(val) > 0) {
                            const badgeClass = getQualityBadgeClass(qTitle);
                            html += `
                            <div class="quality-box">
                                <span class="quality-name">${qTitle}</span>
                                <span class="price-tag ${badgeClass}">${val}</span>
                            </div>`;
                        }
                    }

                    html += `</div></div>`;
                }
            });
            html += '</div>';
            container.innerHTML = html;

        } else {
            // عرض الجدول المطور
            let html = '<div class="table-card"><div class="table-wrapper"><table><thead><tr>';
            headers.forEach(h => html += `<th>${h}</th>`);
            html += '</tr></thead><tbody>';

            items.forEach(item => {
                if (item.isGroup) {
                    html += `<tr data-group="true" class="group-banner"><td colspan="${headers.length}">${item.name.toUpperCase()}</td></tr>`;
                } else {
                    totalCount++;
                    html += '<tr data-item="true">';
                    for (let c = 0; c < headers.length; c++) {
                        const val = item.values[c] || '-';
                        const isPrice = !isNaN(val) && val !== '' && val !== '-' && Number(val) > 0;
                        if (c === 0) {
                            html += `<td>${val} ${item.updated ? ' <small style="color:#d97706;">●</small>' : ''}</td>`;
                        } else if (isPrice) {
                            const badgeClass = getQualityBadgeClass(headers[c] || '');
                            html += `<td><span class="price-tag ${badgeClass}">${val}</span></td>`;
                        } else {
                            html += `<td>${val}</td>`;
                        }
                    }
                    html += '</tr>';
                }
            });
            html += '</tbody></table></div></div>';
            container.innerHTML = html;
        }

        document.getElementById('statTotalRows').innerText = totalCount;
        applyFilter();
    }

    function applyFilter() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        let visible = 0;

        if (currentViewMode === 'cards') {
            const cards = document.querySelectorAll('.item-card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                if (text.includes(q)) {
                    card.style.display = '';
                    visible++;
                } else {
                    card.style.display = 'none';
                }
            });
        } else {
            const rows = document.querySelectorAll('table tbody tr[data-item="true"]');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                if (text.includes(q)) {
                    row.style.display = '';
                    visible++;
                } else {
                    row.style.display = 'none';
                }
            });
        }

        document.getElementById('statFilteredRows').innerText = visible;
    }
</script>

</body>
</html>
