<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل أسعار الشاشات وقطع الغيار</title>
    <!-- مكتبة SheetJS لقراءة ملفات الإكسل -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        body.dark {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            padding: 10px;
            font-size: 14px;
            direction: rtl;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .search-box-wrap {
            position: relative;
            width: 100%;
        }

        .search-box-wrap input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--primary);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            font-weight: 700;
            background: var(--card-bg);
            color: var(--text-dark);
        }

        .search-box-wrap input:focus {
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }

        .action-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 80px;
            padding: 9px 10px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-upload { background: var(--primary); color: white; }
        .btn-clear { background: #fee2e2; color: #991b1b; }
        body.dark .btn-clear { background: #451a1a; color: #fca5a5; }
        .btn-toggle { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        body.dark .btn-toggle { background: #0c4a6e; color: #7dd3fc; border-color: #0284c7; }
        .btn-theme { background: #f1f5f9; color: #334155; border: 1px solid var(--border); }
        body.dark .btn-theme { background: #334155; color: #f8fafc; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.03);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        body.dark .stats-bar { background: #0f172a; }
        .stats-bar strong { color: var(--primary); font-size: 0.95rem; }
        .save-indicator { color: var(--success); font-size: 0.78rem; font-weight: 800; }

        .brand-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .brand-tab {
            background: #e2e8f0;
            border: none;
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            color: #475569;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        body.dark .brand-tab { background: #334155; color: #cbd5e1; }
        .brand-tab.active {
            background: var(--primary);
            color: white !important;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.3);
        }

        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .model-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .updated-tag {
            background: #fef3c7;
            color: #b45309;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .qualities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
        }

        .quality-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
        }

        .quality-name {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .price-tag {
            font-size: 1rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            width: 100%;
            text-align: center;
        }

        .bg-original { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        body.dark .bg-original { background-color: #064e3b; color: #6ee7b7; border-color: #047857; }
        .bg-oled { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        body.dark .bg-oled { background-color: #0c4a6e; color: #7dd3fc; border-color: #0284c7; }
        .bg-incell { background-color: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        body.dark .bg-incell { background-color: #78350f; color: #fde047; border-color: #a16207; }
        .bg-other { background-color: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
        body.dark .bg-other { background-color: #581c87; color: #e9d5ff; border-color: #7e22ce; }

        .group-banner {
            background: var(--primary);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 1.05rem;
            text-align: center;
            margin-top: 6px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
            text-transform: uppercase;
        }

        .table-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }

        .table-wrapper { max-height: 70vh; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        thead { position: sticky; top: 0; background: #0f172a; color: #ffffff; z-index: 20; }
        body.dark thead { background: #0284c7; }
        th { padding: 10px 6px; font-weight: 700; font-size: 0.82rem; border-bottom: 2px solid var(--border); }
        th:first-child, td:first-child { text-align: right; padding-right: 12px; font-weight: 800; }
        td { padding: 10px 6px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
        tbody tr:nth-child(even) { background-color: rgba(0,0,0,0.02); }
        body.dark tbody tr:nth-child(even) { background-color: rgba(255,255,255,0.03); }

        .empty-box {
            padding: 50px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="app-container">

    <div class="top-panel">
        <div class="search-box-wrap">
            <input type="text" id="searchInput" placeholder="🔍 ابحث باسم الموديل فقط (مثال: 12, Note9, A52)..." onkeyup="applyFilter()">
        </div>

        <div class="action-btns">
            <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">📥 رفع إكسل</button>
            <button class="btn btn-toggle" id="viewToggleBtn" onclick="toggleViewMode()">📱 عرض الكروت</button>
            <button class="btn btn-theme" id="themeToggleBtn" onclick="toggleDarkMode()">🌙 الوضع المظلم</button>
            <button class="btn btn-clear" onclick="clearAllData()">🗑️ مسح البيانات</button>
            <input type="file" id="fileInput" multiple accept=".xlsx, .xls" style="display: none;" onchange="handleFiles(this.files)">
        </div>

        <div class="stats-bar">
            <span>النتائج المطابقة: <strong id="statFilteredRows">0</strong> / <strong id="statTotalRows">0</strong></span>
            <span class="save-indicator" id="saveStatus">💾 محفوظ تلقائياً</span>
        </div>

        <div class="brand-tabs" id="brandTabs"></div>
    </div>

    <div id="displayArea">
        <div class="empty-box">
            لا توجد بيانات محفوظة حالياً.<br>اضغط على <strong>"📥 رفع إكسل"</strong> لإضافة الملفات.
        </div>
    </div>

</div>

<script>
    const STORAGE_KEY = 'PHONE_PARTS_STORE_V5';
    let masterStore = {};
    let activeBrand = '';
    let currentViewMode = 'cards';

    const IGNORE_HEADER_WORDS = [
        'no', 'n/o', '#', 'م', 'ت', 'تسلسل', 'الرقم', 'id', 'modle', 'model', 'الموديل', 
        'الصنف', 'الموديل/الصنف', 'original', 'oled', 'oled2', 'incell', 'incel', 'copy', 
        'price', 'السعر', 'سعر', 'نوع', 'جودة'
    ];

    const COLOR_WORDS = [
        'black', 'blk', 'white', 'wht', 'green', 'grn', 'blue', 'blu', 'pink', 'gold', 
        'silver', 'slv', 'violet', 'lavender', 'gray', 'grey', 'yellow', 'red', 'orange', 
        'purple', 'no frame', 'frame', 'black+frame', 'blk+frame', 'black inner', 'white inner',
        'blue inner', 'green inner', 'gold inner', 'silver inner'
    ];

    function cleanStr(val) {
        if (val === null || val === undefined) return '';
        return String(val).replace(/\r?\n|\r/g, ' ').trim();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadDarkMode();
        loadFromStorage();
    });

    function toggleDarkMode() {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        localStorage.setItem('DARK_MODE', isDark ? 'enabled' : 'disabled');
        document.getElementById('themeToggleBtn').innerText = isDark ? '☀️ الوضع المضيء' : '🌙 الوضع المظلم';
    }

    function loadDarkMode() {
        if (localStorage.getItem('DARK_MODE') === 'enabled') {
            document.body.classList.add('dark');
            const btn = document.getElementById('themeToggleBtn');
            if (btn) btn.innerText = '☀️ الوضع المضيء';
        }
    }

    function saveToStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(masterStore));
            document.getElementById('saveStatus').innerText = '💾 تم الحفظ تلقائياً';
        } catch (e) {
            console.error('Storage error', e);
        }
    }

    function loadFromStorage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                masterStore = JSON.parse(saved);
                const keys = Object.keys(masterStore);
                if (keys.length > 0) {
                    activeBrand = keys[0];
                    renderBrandTabs();
                    renderDisplay();
                }
            } catch (e) {
                console.error(e);
            }
        }
    }

    function clearAllData() {
        if (confirm('هل أنت متأكد من مسح جميع البيانات والملفات المحفوظة؟')) {
            localStorage.removeItem(STORAGE_KEY);
            masterStore = {};
            activeBrand = '';
            document.getElementById('brandTabs').innerHTML = '';
            document.getElementById('displayArea').innerHTML = '<div class="empty-box">تم مسح البيانات بنجاح.<br>قم برفع ملفات جديدة.</div>';
            document.getElementById('statFilteredRows').innerText = '0';
            document.getElementById('statTotalRows').innerText = '0';
            document.getElementById('fileInput').value = '';
        }
    }

    function toggleViewMode() {
        currentViewMode = currentViewMode === 'cards' ? 'table' : 'cards';
        document.getElementById('viewToggleBtn').innerText = currentViewMode === 'cards' ? '📱 عرض الكروت' : '📊 عرض الجدول';
        renderDisplay();
    }

    function handleFiles(files) {
        if (!files.length) return;

        let promises = Array.from(files).map(file => {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    let brandKey = detectBrandKey(file.name);
                    let sheetName = workbook.SheetNames[0];
                    const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: '' });

                    if (rawRows.length > 0) {
                        processSmartData(brandKey, file.name, rawRows);
                    }
                    resolve();
                };
                reader.readAsArrayBuffer(file);
            });
        });

        Promise.all(promises).then(() => {
            saveToStorage();
            if (!activeBrand || !masterStore[activeBrand]) {
                activeBrand = Object.keys(masterStore)[0] || '';
            }
            renderBrandTabs();
            renderDisplay();
        });
    }

    function detectBrandKey(filename) {
        const fn = filename.toLowerCase();
        if (fn.includes('samsung') || fn.includes('سامسونج')) return 'Samsung';
        if (fn.includes('ipone') || fn.includes('iphone') || fn.includes('آيفون')) return 'iPhone';
        if (fn.includes('svc') || fn.includes('service')) return 'SVC (قطع صيانة)';
        if (fn.includes('inf') || fn.includes('huawei') || fn.includes('xiaomi') || fn.includes('redmi')) return 'Infinix & Xiaomi';
        return filename.replace(/\.[^/.]+$/, "");
    }

    function formatBannerText(filename, brandKey) {
        let str = filename.replace(/\.[^/.]+$/, "").toUpperCase();
        
        let dateMatch = str.match(/(\d{1,4}[\/\.-]\d{1,2}[\/\.-]\d{1,4})/);
        let dateStr = '2026.08.10';
        
        if (dateMatch) {
            let rawDate = dateMatch[0].replace(/[\/-]/g, '.');
            let parts = rawDate.split('.');
            if (parts.length === 3) {
                if (parts[0].length === 2 && parts[2].length === 4) {
                    dateStr = `${parts[2]}.${parts[1]}.${parts[0]}`;
                } else if (parts[0].length === 4) {
                    dateStr = `${parts[0]}.${parts[1]}.${parts[2]}`;
                } else {
                    dateStr = rawDate;
                }
            }
        }

        let cleanBrandName = brandKey.toUpperCase();
        if (cleanBrandName.includes('IPHONE')) cleanBrandName = 'IPHONE LCD';
        
        return `PRICE OF ${cleanBrandName} DATE ${dateStr}`;
    }

    function isColorOnly(text) {
        if (!text) return false;
        let lower = text.toLowerCase().trim();
        return COLOR_WORDS.includes(lower);
    }

    function isHeaderRow(rowStrList) {
        let matches = 0;
        rowStrList.forEach(s => {
            if (IGNORE_HEADER_WORDS.includes(s.toLowerCase().trim())) {
                matches++;
            }
        });
        return matches >= 2;
    }

    function processSmartData(brandKey, fileName, rawRows) {
        let maxCols = 0;
        for (let r = 0; r < Math.min(20, rawRows.length); r++) {
            if (rawRows[r] && rawRows[r].length > maxCols) maxCols = rawRows[r].length;
        }

        let modelColIndex = 0;
        let numCount = 0;
        let col1HasText = false;

        for (let r = 0; r < Math.min(15, rawRows.length); r++) {
            let v0 = cleanStr(rawRows[r][0]);
            let v1 = cleanStr(rawRows[r][1]);
            if (v0 && !isNaN(v0) && Number(v0) < 500) numCount++;
            if (v1 && isNaN(v1) && v1.length > 1) col1HasText = true;
        }

        if (numCount >= 3 && col1HasText) {
            modelColIndex = 1;
        }

        let headers = new Array(maxCols).fill('');
        for (let c = 0; c < maxCols; c++) {
            for (let r = 0; r < Math.min(10, rawRows.length); r++) {
                let cellVal = cleanStr(rawRows[r][c]);
                if (cellVal && isNaN(cellVal) && cellVal.length > 1 && !IGNORE_HEADER_WORDS.includes(cellVal.toLowerCase())) {
                    headers[c] = cellVal;
                    break;
                }
            }
            if (!headers[c]) headers[c] = (c === modelColIndex) ? 'الموديل/الصنف' : ('نوع ' + c);
        }

        if (!masterStore[brandKey]) {
            masterStore[brandKey] = {
                bannerTitle: formatBannerText(fileName, brandKey),
                headers: headers,
                modelColIndex: modelColIndex,
                itemsMap: {},
                itemsList: []
            };
        }

        const store = masterStore[brandKey];
        store.bannerTitle = formatBannerText(fileName, brandKey);
        store.headers = headers;

        let lastValidModel = '';

        for (let r = 0; r < rawRows.length; r++) {
            const row = rawRows[r];
            if (!row || row.every(c => cleanStr(c) === '')) continue;

            const rowStrings = row.map(c => cleanStr(c));
            if (isHeaderRow(rowStrings)) continue;

            let cellModel = cleanStr(row[modelColIndex]);

            if (IGNORE_HEADER_WORDS.includes(cellModel.toLowerCase())) continue;

            if (!cellModel || isColorOnly(cellModel)) {
                cellModel = lastValidModel;
            } else {
                lastValidModel = cellModel;
            }

            if (!cellModel) continue;

            const modelKey = cellModel.toLowerCase();

            if (!store.itemsMap[modelKey]) {
                const itemObj = {
                    isGroup: false,
                    modelName: cellModel,
                    key: modelKey,
                    variantsMap: {},
                    updated: false
                };
                store.itemsMap[modelKey] = itemObj;
                store.itemsList.push(itemObj);
            }

            const itemObj = store.itemsMap[modelKey];

            let colorOrQuality = '';
            let price = '';

            for (let c = modelColIndex + 1; c < row.length; c++) {
                let val = cleanStr(row[c]);
                if (!val) continue;

                if (!isNaN(val) && Number(val) > 0) {
                    price = val;
                } else if (isNaN(val)) {
                    if (headers[c] && !headers[c].startsWith('نوع ')) {
                        colorOrQuality = headers[c];
                    } else {
                        colorOrQuality = val;
                    }
                }
            }

            if (price && colorOrQuality) {
                itemObj.variantsMap[colorOrQuality] = price;
            } else if (price && !colorOrQuality) {
                let defaultQuality = headers[modelColIndex + 1] || 'السعر';
                itemObj.variantsMap[defaultQuality] = price;
            }
        }
    }

    function renderBrandTabs() {
        const container = document.getElementById('brandTabs');
        container.innerHTML = '';

        Object.keys(masterStore).forEach(b => {
            const btn = document.createElement('button');
            btn.className = `brand-tab ${b === activeBrand ? 'active' : ''}`;
            btn.innerText = b;
            btn.onclick = () => {
                activeBrand = b;
                renderBrandTabs();
                renderDisplay();
            };
            container.appendChild(btn);
        });
    }

    function getQualityBadgeClass(qName) {
        const q = qName.toLowerCase();
        if (q.includes('orig') || q.includes('service') || q.includes('org') || q.includes('اصلي') || q.includes('أصلي')) return 'bg-original';
        if (q.includes('oled') || q.includes('gx')) return 'bg-oled';
        if (q.includes('incell') || q.includes('incel') || q.includes('copy') || q.includes('tft') || q.includes('تجاري')) return 'bg-incell';
        return 'bg-other';
    }

    function renderDisplay() {
        const container = document.getElementById('displayArea');
        if (!activeBrand || !masterStore[activeBrand]) {
            container.innerHTML = '<div class="empty-box">لا توجد بيانات متاحة</div>';
            return;
        }

        const data = masterStore[activeBrand];
        const items = data.itemsList;

        let totalCount = 0;

        if (currentViewMode === 'cards') {
            let html = '<div class="cards-grid">';
            
            if (data.bannerTitle) {
                html += `<div class="group-banner" data-group="true">${data.bannerTitle}</div>`;
            }

            items.forEach(item => {
                totalCount++;
                const modelTitle = item.modelName;
                const safeModelAttr = modelTitle.toLowerCase().replace(/"/g, '&quot;');
                
                let pricesHtml = '';
                const variantKeys = Object.keys(item.variantsMap);

                variantKeys.forEach(vKey => {
                    const priceVal = item.variantsMap[vKey];
                    const badgeClass = getQualityBadgeClass(vKey);

                    pricesHtml += `
                    <div class="quality-box">
                        <span class="quality-name">${vKey}</span>
                        <span class="price-tag ${badgeClass}">${priceVal}</span>
                    </div>`;
                });

                html += `
                <div class="item-card" data-item="true" data-model="${safeModelAttr}">
                    <div class="card-header">
                        <div class="title-wrap">
                            <span class="model-title">${modelTitle}</span>
                        </div>
                    </div>

                    <div class="qualities-grid">
                        ${pricesHtml || '<div style="color:var(--text-muted); font-size:0.8rem;">لا توجد أسعار</div>'}
                    </div>
                </div>`;
            });

            html += '</div>';
            container.innerHTML = html;

        } else {
            let html = '<div class="table-card"><div class="table-wrapper"><table><thead><tr>';
            html += `<th>الموديل / الصنف</th><th>النوع / اللون</th><th>السعر</th>`;
            html += '</tr></thead><tbody>';

            if (data.bannerTitle) {
                html += `<tr data-group="true" class="group-banner"><td colspan="3">${data.bannerTitle}</td></tr>`;
            }

            items.forEach(item => {
                totalCount++;
                const modelTitle = item.modelName;
                const safeModelAttr = modelTitle.toLowerCase().replace(/"/g, '&quot;');
                const variantKeys = Object.keys(item.variantsMap);

                variantKeys.forEach((vKey, idx) => {
                    const priceVal = item.variantsMap[vKey];
                    const badgeClass = getQualityBadgeClass(vKey);

                    html += `<tr data-item="true" data-model="${safeModelAttr}">`;
                    if (idx === 0) {
                        html += `<td rowspan="${variantKeys.length}" style="vertical-align:middle; font-weight:bold;">${modelTitle}</td>`;
                    }
                    html += `<td>${vKey}</td>`;
                    html += `<td><span class="price-tag ${badgeClass}">${priceVal}</span></td>`;
                    html += '</tr>';
                });
            });

            html += '</tbody></table></div></div>';
            container.innerHTML = html;
        }

        document.getElementById('statTotalRows').innerText = totalCount;
        applyFilter();
    }

    function applyFilter() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        let visible = 0;

        const selector = currentViewMode === 'cards' 
            ? '.item-card[data-item="true"]' 
            : 'table tbody tr[data-item="true"]';

        const elements = document.querySelectorAll(selector);

        elements.forEach(el => {
            const modelName = (el.getAttribute('data-model') || '').toLowerCase();
            
            if (q === '' || modelName.includes(q)) {
                el.style.display = '';
                visible++;
            } else {
                el.style.display = 'none';
            }
        });

        document.getElementById('statFilteredRows').innerText = visible;
    }
</script>

</body>
</html>
