<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل أسعار الشاشات وقطع الغيار</title>
    <!-- مكتبة SheetJS لقراءة ملفات الإكسل -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        body.dark {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            padding: 10px;
            font-size: 14px;
            direction: rtl;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .search-box-wrap {
            position: relative;
            width: 100%;
        }

        .search-box-wrap input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--primary);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            font-weight: 700;
            background: var(--card-bg);
            color: var(--text-dark);
        }

        .search-box-wrap input:focus {
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }

        .action-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 80px;
            padding: 9px 10px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-upload { background: var(--primary); color: white; }
        .btn-clear { background: #fee2e2; color: #991b1b; }
        body.dark .btn-clear { background: #451a1a; color: #fca5a5; }
        .btn-toggle { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        body.dark .btn-toggle { background: #0c4a6e; color: #7dd3fc; border-color: #0284c7; }
        .btn-theme { background: #f1f5f9; color: #334155; border: 1px solid var(--border); }
        body.dark .btn-theme { background: #334155; color: #f8fafc; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.03);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        body.dark .stats-bar { background: #0f172a; }
        .stats-bar strong { color: var(--primary); font-size: 0.95rem; }
        .save-indicator { color: var(--success); font-size: 0.78rem; font-weight: 800; }

        .brand-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .brand-tab {
            background: #e2e8f0;
            border: none;
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            color: #475569;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        body.dark .brand-tab { background: #334155; color: #cbd5e1; }
        .brand-tab.active {
            background: var(--primary);
            color: white !important;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.3);
        }

        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .model-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .model-color-tag {
            background: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
            font-size: 0.8rem;
            padding: 3px 9px;
            border-radius: 6px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        body.dark .model-color-tag {
            background: #0c4a6e;
            color: #7dd3fc;
            border-color: #0284c7;
        }

        .updated-tag {
            background: #fef3c7;
            color: #b45309;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .info-tags-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .info-badge {
            background: rgba(2, 132, 199, 0.08);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        body.dark .info-badge { background: rgba(255, 255, 255, 0.05); }
        .info-title { color: var(--text-muted); font-weight: 600; }
        .info-value { color: var(--primary); font-weight: 700; }

        .qualities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
        }

        .quality-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
        }

        .quality-name {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .price-tag {
            font-size: 1rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 6px;
            width: 100%;
        }

        .bg-original { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        body.dark .bg-original { background-color: #064e3b; color: #6ee7b7; border-color: #047857; }
        .bg-oled { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        body.dark .bg-oled { background-color: #0c4a6e; color: #7dd3fc; border-color: #0284c7; }
        .bg-incell { background-color: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        body.dark .bg-incell { background-color: #78350f; color: #fde047; border-color: #a16207; }
        .bg-other { background-color: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
        body.dark .bg-other { background-color: #581c87; color: #e9d5ff; border-color: #7e22ce; }

        /* 🎨 الشريط العلوي المحسن لنفس تصميم صورة 2 */
        .group-banner {
            background: var(--primary);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 1.05rem;
            text-align: center;
            margin-top: 6px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
            text-transform: uppercase;
        }

        .table-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }

        .table-wrapper { max-height: 70vh; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        thead { position: sticky; top: 0; background: #0f172a; color: #ffffff; z-index: 20; }
        body.dark thead { background: #0284c7; }
        th { padding: 10px 6px; font-weight: 700; font-size: 0.82rem; border-bottom: 2px solid var(--border); }
        th:first-child, td:first-child { text-align: right; padding-right: 12px; font-weight: 800; }
        td { padding: 10px 6px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
        tbody tr:nth-child(even) { background-color: rgba(0,0,0,0.02); }
        body.dark tbody tr:nth-child(even) { background-color: rgba(255,255,255,0.03); }

        .empty-box {
            padding: 50px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="app-container">

    <div class="top-panel">
        <div class="search-box-wrap">
            <input type="text" id="searchInput" placeholder="🔍 ابحث باسم الموديل فقط (مثال: 12, Note9, A52)..." onkeyup="applyFilter()">
        </div>

        <div class="action-btns">
            <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">📥 رفع إكسل</button>
            <button class="btn btn-toggle" id="viewToggleBtn" onclick="toggleViewMode()">📱 عرض الكروت</button>
            <button class="btn btn-theme" id="themeToggleBtn" onclick="toggleDarkMode()">🌙 الوضع المظلم</button>
            <button class="btn btn-clear" onclick="clearAllData()">🗑️ مسح البيانات</button>
            <input type="file" id="fileInput" multiple accept=".xlsx, .xls" style="display: none;" onchange="handleFiles(this.files)">
        </div>

        <div class="stats-bar">
            <span>النتائج المطابقة: <strong id="statFilteredRows">0</strong> / <strong id="statTotalRows">0</strong></span>
            <span class="save-indicator" id="saveStatus">💾 محفوظ تلقائياً</span>
        </div>

        <div class="brand-tabs" id="brandTabs"></div>
    </div>

    <div id="displayArea">
        <div class="empty-box">
            لا توجد بيانات محفوظة حالياً.<br>اضغط على <strong>"📥 رفع إكسل"</strong> لإضافة الملفات.
        </div>
    </div>

</div>

<script>
    const STORAGE_KEY = 'PHONE_PARTS_STORE_V4';
    let masterStore = {};
    let activeBrand = '';
    let currentViewMode = 'cards';

    function cleanStr(val) {
        if (val === null || val === undefined) return '';
        return String(val).replace(/\r?\n|\r/g, ' ').trim();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadDarkMode();
        loadFromStorage();
    });

    function toggleDarkMode() {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        localStorage.setItem('DARK_MODE', isDark ? 'enabled' : 'disabled');
        document.getElementById('themeToggleBtn').innerText = isDark ? '☀️ الوضع المضيء' : '🌙 الوضع المظلم';
    }

    function loadDarkMode() {
        if (localStorage.getItem('DARK_MODE') === 'enabled') {
            document.body.classList.add('dark');
            const btn = document.getElementById('themeToggleBtn');
            if (btn) btn.innerText = '☀️ الوضع المضيء';
        }
    }

    function saveToStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(masterStore));
            document.getElementById('saveStatus').innerText = '💾 تم الحفظ تلقائياً';
        } catch (e) {
            console.error('Storage error', e);
        }
    }

    function loadFromStorage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                masterStore = JSON.parse(saved);
                const keys = Object.keys(masterStore);
                if (keys.length > 0) {
                    activeBrand = keys[0];
                    renderBrandTabs();
                    renderDisplay();
                }
            } catch (e) {
                console.error(e);
            }
        }
    }

    function clearAllData() {
        if (confirm('هل أنت متأكد من مسح جميع البيانات والملفات المحفوظة؟')) {
            localStorage.removeItem(STORAGE_KEY);
            masterStore = {};
            activeBrand = '';
            document.getElementById('brandTabs').innerHTML = '';
            document.getElementById('displayArea').innerHTML = '<div class="empty-box">تم مسح البيانات بنجاح.<br>قم برفع ملفات جديدة.</div>';
            document.getElementById('statFilteredRows').innerText = '0';
            document.getElementById('statTotalRows').innerText = '0';
            document.getElementById('fileInput').value = '';
        }
    }

    function toggleViewMode() {
        currentViewMode = currentViewMode === 'cards' ? 'table' : 'cards';
        document.getElementById('viewToggleBtn').innerText = currentViewMode === 'cards' ? '📱 عرض الكروت' : '📊 عرض الجدول';
        renderDisplay();
    }

    function handleFiles(files) {
        if (!files.length) return;

        let promises = Array.from(files).map(file => {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    let brandKey = detectBrandKey(file.name);
                    let sheetName = workbook.SheetNames[0];
                    const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: '' });

                    if (rawRows.length > 0) {
                        processSmartData(brandKey, rawRows);
                    }
                    resolve();
                };
                reader.readAsArrayBuffer(file);
            });
        });

        Promise.all(promises).then(() => {
            saveToStorage();
            if (!activeBrand || !masterStore[activeBrand]) {
                activeBrand = Object.keys(masterStore)[0] || '';
            }
            renderBrandTabs();
            renderDisplay();
        });
    }

    function detectBrandKey(filename) {
        const fn = filename.toLowerCase();
        if (fn.includes('samsung') || fn.includes('سامسونج')) return 'Samsung';
        if (fn.includes('ipone') || fn.includes('iphone') || fn.includes('آيفون')) return 'iPhone';
        if (fn.includes('svc') || fn.includes('service')) return 'SVC (قطع صيانة)';
        if (fn.includes('inf') || fn.includes('huawei') || fn.includes('xiaomi') || fn.includes('redmi')) return 'Infinix & Xiaomi';
        return filename.replace(/\.[^/.]+$/, "");
    }

    /* 🎯 دالة لتنسيق شريط العنوان والتاريخ مثل صورة 2 */
    function formatBannerText(rawText, brandKey) {
        let str = cleanStr(rawText).toUpperCase();
        
        if (str.includes('PRICE OF')) return str;

        // استخراج التاريخ من النص
        let dateMatch = str.match(/(\d{1,4}[\/\.-]\d{1,2}[\/\.-]\d{1,4})/);
        if (dateMatch) {
            let dateStr = dateMatch[0].replace(/[\/-]/g, '.');
            let parts = dateStr.split('.');
            if (parts.length === 3 && parts[0].length === 2 && parts[2].length === 4) {
                // تحويل التاريخ لـ YYYY.MM.DD
                dateStr = `${parts[2]}.${parts[1]}.${parts[0]}`;
            }
            return `PRICE OF ${brandKey.toUpperCase()} DATE ${dateStr}`;
        }
        
        return `PRICE OF ${brandKey.toUpperCase()} DATE ${str}`;
    }

    function processSmartData(brandKey, rawRows) {
        let maxCols = 0;
        for (let r = 0; r < Math.min(15, rawRows.length); r++) {
            if (rawRows[r] && rawRows[r].length > maxCols) maxCols = rawRows[r].length;
        }

        const keywords = ['original', 'oled', 'incell', 'incel', 'copy', 'fog', 'gx', 'aaa', 'ori', 'org', 'service', 'pack', 'glass', 'change', 'tft', 'lcd', 'نوع', 'درجة', 'جودة', 'شاشة', 'سعر', 'موديل', 'لون', 'اللون', 'ملاحظات', 'فريم', 'إطار', 'color'];

        let detectedHeaders = new Array(maxCols).fill('');
        
        for (let c = 0; c < maxCols; c++) {
            for (let r = 0; r < Math.min(10, rawRows.length); r++) {
                let cellVal = cleanStr(rawRows[r][c]);
                if (cellVal && isNaN(cellVal) && !cellVal.match(/^\d{1,2}[\/\.-]\d{1,2}[\/\.-]\d{2,4}$/)) {
                    if (keywords.some(kw => cellVal.toLowerCase().includes(kw)) || cellVal.length > 2) {
                        detectedHeaders[c] = cellVal;
                        break;
                    }
                }
            }
        }

        let modelColIndex = 0;
        const col0Header = (detectedHeaders[0] || '').toLowerCase().trim();
        const seqHeaders = ['no', 'n', '#', 'م', 'ت', 'تسلسل', 'الرقم', 'id'];

        if (seqHeaders.includes(col0Header)) {
            modelColIndex = 1;
        } else {
            let numCount = 0;
            let col1HasText = false;
            for (let r = 0; r < Math.min(15, rawRows.length); r++) {
                let v0 = cleanStr(rawRows[r][0]);
                let v1 = cleanStr(rawRows[r][1]);
                if (v0 && !isNaN(v0)) numCount++;
                if (v1 && isNaN(v1) && v1.length > 1) col1HasText = true;
            }
            if (numCount > 3 && col1HasText) {
                modelColIndex = 1;
            }
        }

        for (let c = 0; c < maxCols; c++) {
            if (!detectedHeaders[c] || detectedHeaders[c] === '-') {
                detectedHeaders[c] = (c === modelColIndex) ? 'الموديل/الصنف' : ('عمود ' + c);
            }
        }

        if (!masterStore[brandKey]) {
            masterStore[brandKey] = {
                headers: detectedHeaders,
                modelColIndex: modelColIndex,
                itemsMap: {},
                itemsList: []
            };
        }

        const store = masterStore[brandKey];
        store.headers = detectedHeaders;
        store.modelColIndex = modelColIndex;

        const ignoreHeaderList = ['no', 'n', '#', 'م', 'ت', 'تسلسل', 'الرقم', 'id', 'modle', 'model', 'الموديل', 'الصنف', 'الموديل/الصنف'];

        for (let r = 0; r < rawRows.length; r++) {
            const row = rawRows[r];
            if (!row || row.every(c => cleanStr(c) === '')) continue;

            const nonNull = row.filter(c => cleanStr(c) !== '');
            const isGroup = nonNull.length === 1 && typeof nonNull[0] === 'string' && isNaN(nonNull[0]);

            if (isGroup) {
                const groupName = cleanStr(nonNull[0]);
                // تجنب إضافة الهيدر كعنوان مجموعة إذا كان كلمة مثل NO أو Modle
                if (!ignoreHeaderList.includes(groupName.toLowerCase())) {
                    const formattedTitle = formatBannerText(groupName, brandKey);
                    if (!store.itemsMap['GRP_' + formattedTitle]) {
                        const gObj = { isGroup: true, name: formattedTitle };
                        store.itemsMap['GRP_' + formattedTitle] = gObj;
                        store.itemsList.push(gObj);
                    }
                }
                continue;
            }

            let modelName = cleanStr(row[modelColIndex]);
            if ((!modelName || !isNaN(modelName)) && row[modelColIndex + 1]) {
                if (isNaN(cleanStr(row[modelColIndex + 1]))) {
                    modelName = cleanStr(row[modelColIndex + 1]);
                }
            }

            const lowerModel = (modelName || '').toLowerCase();

            /* 🚫 استبعاد صف الهيدر والعناوين لعدم إنشائها ككارت مستقل (حل مشكلة صورة 1) */
            if (!modelName || ignoreHeaderList.includes(lowerModel) || keywords.some(k => lowerModel === k)) {
                continue;
            }

            const vals = [];
            let headerMatches = 0;
            for (let c = 0; c < detectedHeaders.length; c++) {
                let cellVal = cleanStr(row[c]);
                vals.push(cellVal);
                if (cellVal && detectedHeaders[c] && cellVal.toLowerCase() === detectedHeaders[c].toLowerCase()) {
                    headerMatches++;
                }
            }

            // إذا تكررت أسماء الأعمدة داخل الصف يتم تتجاهله (هيدر مكرر)
            if (headerMatches >= 2) continue;

            const key = modelName.toLowerCase();
            const existing = store.itemsMap[key];

            if (existing) {
                for (let c = 0; c < vals.length; c++) {
                    if (vals[c] !== '') existing.values[c] = vals[c];
                }
                existing.updated = true;
            } else {
                const itemObj = {
                    isGroup: false,
                    modelName: modelName,
                    key: key,
                    values: vals,
                    updated: false
                };
                store.itemsMap[key] = itemObj;
                store.itemsList.push(itemObj);
            }
        }
    }

    function renderBrandTabs() {
        const container = document.getElementById('brandTabs');
        container.innerHTML = '';

        Object.keys(masterStore).forEach(b => {
            const btn = document.createElement('button');
            btn.className = `brand-tab ${b === activeBrand ? 'active' : ''}`;
            btn.innerText = b;
            btn.onclick = () => {
                activeBrand = b;
                renderBrandTabs();
                renderDisplay();
            };
            container.appendChild(btn);
        });
    }

    function getQualityBadgeClass(qName) {
        const q = qName.toLowerCase();
        if (q.includes('orig') || q.includes('service') || q.includes('org') || q.includes('اصلي') || q.includes('أصلي')) return 'bg-original';
        if (q.includes('oled') || q.includes('gx')) return 'bg-oled';
        if (q.includes('incell') || q.includes('incel') || q.includes('copy') || q.includes('tft') || q.includes('تجاري')) return 'bg-incell';
        return 'bg-other';
    }

    function renderDisplay() {
        const container = document.getElementById('displayArea');
        if (!activeBrand || !masterStore[activeBrand]) {
            container.innerHTML = '<div class="empty-box">لا توجد بيانات متاحة</div>';
            return;
        }

        const data = masterStore[activeBrand];
        const headers = data.headers;
        const items = data.itemsList;
        const modelIdx = data.modelColIndex || 0;

        let totalCount = 0;

        if (currentViewMode === 'cards') {
            let html = '<div class="cards-grid">';
            items.forEach(item => {
                if (item.isGroup) {
                    html += `<div class="group-banner" data-group="true">${item.name}</div>`;
                } else {
                    totalCount++;
                    const modelTitle = item.modelName || item.values[modelIdx] || 'غير معنون';
                    const safeModelAttr = modelTitle.toLowerCase().replace(/"/g, '&quot;');
                    
                    let colorHtml = '';
                    let infoTagsHtml = '';
                    let pricesHtml = '';

                    for (let c = 0; c < headers.length; c++) {
                        if (c === modelIdx || (c === 0 && modelIdx === 1)) continue;

                        const val = item.values[c];
                        const qTitle = headers[c] || ('نوع ' + c);

                        if (val && val !== '-' && val !== '') {
                            if (!isNaN(val) && Number(val) > 0) {
                                const badgeClass = getQualityBadgeClass(qTitle);
                                pricesHtml += `
                                <div class="quality-box">
                                    <span class="quality-name">${qTitle}</span>
                                    <span class="price-tag ${badgeClass}">${val}</span>
                                </div>`;
                            } else {
                                const lowerTitle = qTitle.toLowerCase();
                                if (lowerTitle.includes('لون') || lowerTitle.includes('color')) {
                                    colorHtml += `<span class="model-color-tag">🎨 ${val}</span>`;
                                } else {
                                    infoTagsHtml += `
                                    <div class="info-badge">
                                        <span class="info-title">${qTitle}:</span>
                                        <span class="info-value">${val}</span>
                                    </div>`;
                                }
                            }
                        }
                    }

                    html += `
                    <div class="item-card" data-item="true" data-model="${safeModelAttr}">
                        <div class="card-header">
                            <div class="title-wrap">
                                <span class="model-title">${modelTitle}</span>
                                ${colorHtml}
                            </div>
                            ${item.updated ? '<span class="updated-tag">تم التحديث</span>' : ''}
                        </div>

                        ${infoTagsHtml ? `<div class="info-tags-wrap">${infoTagsHtml}</div>` : ''}

                        <div class="qualities-grid">
                            ${pricesHtml}
                        </div>
                    </div>`;
                }
            });
            html += '</div>';
            container.innerHTML = html;

        } else {
            let html = '<div class="table-card"><div class="table-wrapper"><table><thead><tr>';
            headers.forEach((h, idx) => {
                if (idx === 0 && modelIdx === 1) return;
                html += `<th>${h}</th>`;
            });
            html += '</tr></thead><tbody>';

            items.forEach(item => {
                if (item.isGroup) {
                    html += `<tr data-group="true" class="group-banner"><td colspan="${headers.length}">${item.name}</td></tr>`;
                } else {
                    totalCount++;
                    const modelTitle = item.modelName || item.values[modelIdx] || '';
                    const safeModelAttr = modelTitle.toLowerCase().replace(/"/g, '&quot;');

                    html += `<tr data-item="true" data-model="${safeModelAttr}">`;
                    for (let c = 0; c < headers.length; c++) {
                        if (c === 0 && modelIdx === 1) continue;

                        const val = item.values[c] || '-';
                        const isPrice = !isNaN(val) && val !== '' && val !== '-' && Number(val) > 0;
                        if (c === modelIdx) {
                            html += `<td>${val} ${item.updated ? ' <small style="color:#d97706;">●</small>' : ''}</td>`;
                        } else if (isPrice) {
                            const badgeClass = getQualityBadgeClass(headers[c] || '');
                            html += `<td><span class="price-tag ${badgeClass}">${val}</span></td>`;
                        } else {
                            html += `<td>${val}</td>`;
                        }
                    }
                    html += '</tr>';
                }
            });
            html += '</tbody></table></div></div>';
            container.innerHTML = html;
        }

        document.getElementById('statTotalRows').innerText = totalCount;
        applyFilter();
    }

    function applyFilter() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        let visible = 0;

        const selector = currentViewMode === 'cards' 
            ? '.item-card[data-item="true"]' 
            : 'table tbody tr[data-item="true"]';

        const elements = document.querySelectorAll(selector);

        elements.forEach(el => {
            const modelName = (el.getAttribute('data-model') || '').toLowerCase();
            
            if (q === '' || modelName.includes(q)) {
                el.style.display = '';
                visible++;
            } else {
                el.style.display = 'none';
            }
        });

        document.getElementById('statFilteredRows').innerText = visible;
    }
</script>

</body>
</html>
