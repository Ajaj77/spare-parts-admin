<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة عرض وتحديث قوائم المنتجات</title>
    <!-- مكتبة SheetJS لقراءة ملفات إكسل -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-dark: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px 0;
            color: #0f172a;
        }

        .upload-section {
            background: var(--card-bg);
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-bottom: 25px;
        }

        .upload-section:hover {
            background: #eff6ff;
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .btn-upload {
            background-color: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-upload:hover {
            background-color: var(--primary-hover);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-button {
            background: #e2e8f0;
            border: none;
            padding: 10px 18px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-button.active {
            background: var(--primary);
            color: white;
        }

        .sheet-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .sheet-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .sheet-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .table-wrapper {
            background: var(--card-bg);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #475569;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .stats {
            margin-top: 10px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>نظام عرض وقوائم أسعار المنتجات</h1>
        <p>قم برفع ملفات الإكسل لتفريغها فورياً مع ميزة البحث والتحديث المستمر</p>
    </header>

    <!-- منطقة رفع وتحديث الملفات -->
    <div class="upload-section" onclick="document.getElementById('fileInput').click()">
        <span class="btn-upload">اختيار / تحديث ملفات الإكسل</span>
        <p style="margin-top: 10px; font-size: 13px; color: #64748b;">يمكنك تحديد أكثر من ملف دفعة واحدة (.xlsx, .xls)</p>
        <input type="file" id="fileInput" multiple accept=".xlsx, .xls" onchange="handleFiles(this.files)">
    </div>

    <!-- شريط البحث -->
    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن اسم الجهاز، السعر، المواصفات..." onkeyup="filterData()">
        </div>
    </div>

    <!-- تبويبات الملفات المرفوعة -->
    <div class="tabs-container" id="fileTabs"></div>

    <!-- تبويبات الصفحات الفرعية داخل الملف -->
    <div class="sheet-tabs" id="sheetTabs"></div>

    <!-- جدول عرض البيانات -->
    <div class="table-wrapper">
        <div id="tableContainer">
            <div class="no-data">يرجى رفع ملفات الإكسل لعرض البيانات هنا.</div>
        </div>
    </div>

    <div class="stats" id="statsContainer"></div>
</div>

<script>
    let filesData = {}; 
    let currentFileName = '';
    let currentSheetName = '';

    function handleFiles(files) {
        if (!files.length) return;

        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function (e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                filesData[file.name] = {};

                workbook.SheetNames.forEach(sheetName => {
                    const sheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    filesData[file.name][sheetName] = jsonData;
                });

                renderFileTabs();
                if (!currentFileName || !filesData[currentFileName]) {
                    switchToFile(file.name);
                } else {
                    renderTable();
                }
            };
            reader.readAsArrayBuffer(file);
        });
    }

    function renderFileTabs() {
        const fileTabsContainer = document.getElementById('fileTabs');
        fileTabsContainer.innerHTML = '';

        Object.keys(filesData).forEach(fileName => {
            const btn = document.createElement('button');
            btn.className = `tab-button ${fileName === currentFileName ? 'active' : ''}`;
            btn.innerText = fileName;
            btn.onclick = () => switchToFile(fileName);
            fileTabsContainer.appendChild(btn);
        });
    }

    function switchToFile(fileName) {
        currentFileName = fileName;
        const sheets = Object.keys(filesData[fileName] || {});
        currentSheetName = sheets[0] || '';

        renderFileTabs();
        renderSheetTabs();
        renderTable();
    }

    function renderSheetTabs() {
        const sheetTabsContainer = document.getElementById('sheetTabs');
        sheetTabsContainer.innerHTML = '';

        if (!currentFileName || !filesData[currentFileName]) return;

        const sheets = Object.keys(filesData[currentFileName]);
        if (sheets.length <= 1) return; // عدم إظهار التبويبات الفرعية إذا كانت صفحة واحدة فقط

        sheets.forEach(sheetName => {
            const btn = document.createElement('button');
            btn.className = `sheet-btn ${sheetName === currentSheetName ? 'active' : ''}`;
            btn.innerText = sheetName;
            btn.onclick = () => {
                currentSheetName = sheetName;
                renderSheetTabs();
                renderTable();
            };
            sheetTabsContainer.appendChild(btn);
        });
    }

    function renderTable() {
        const container = document.getElementById('tableContainer');
        const stats = document.getElementById('statsContainer');

        if (!currentFileName || !currentSheetName || !filesData[currentFileName][currentSheetName]) {
            container.innerHTML = '<div class="no-data">لا توجد بيانات متاحة.</div>';
            stats.innerText = '';
            return;
        }

        const rows = filesData[currentFileName][currentSheetName];
        if (rows.length === 0) {
            container.innerHTML = '<div class="no-data">هذه الصفحة فارغة.</div>';
            stats.innerText = '';
            return;
        }

        let html = '<table id="dataTable">';
        
        // الهيدر (السطر الأول)
        html += '<thead><tr>';
        const headers = rows[0] || [];
        headers.forEach(cell => {
            html += `<th>${cell !== undefined ? cell : ''}</th>`;
        });
        html += '</tr></thead><tbody>';

        // الصفوف
        for (let i = 1; i < rows.length; i++) {
            if (rows[i].length === 0) continue;
            html += '<tr>';
            for (let j = 0; j < headers.length; j++) {
                const cellValue = rows[i][j] !== undefined ? rows[i][j] : '';
                html += `<td>${cellValue}</td>`;
            }
            html += '</tr>';
        }

        html += '</tbody></table>';
        container.innerHTML = html;
        stats.innerText = `إجمالي الصفوف: ${rows.length - 1}`;

        filterData(); // تطبيق البحث بعد إعادة رسم الجدول
    }

    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const table = document.getElementById('dataTable');
        if (!table) return;

        const trs = table.getElementsByTagName('tbody')[0]?.getElementsByTagName('tr');
        if (!trs) return;

        let visibleCount = 0;
        Array.from(trs).forEach(row => {
            const text = row.innerText.toLowerCase();
            if (text.includes(query)) {
                row.style.display = '';
                visibleCount++;
            } else {
                row.style.display = 'none';
            }
        });

        document.getElementById('statsContainer').innerText = `المعروض: ${visibleCount} عنصر`;
    }
</script>

</body>
</html>
